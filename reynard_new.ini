[custom]
; 覆盖原机场自带的多余规则
overwrite_original_rules=true
enable_rule_generator=true

; ========================================================
; 1. 策略组配置 (Proxy Groups)
; ========================================================

; 【主出海入口】常规所有境外网站的默认出口，默认走自动故障转移，也支持临时手动切节点
custom_proxy_group=🚀 节点选择`select`[]🔄 故障转移`[]⚡ 便宜主力`[]🛡️ 优质备用`!!GROUPID=0`!!GROUPID=1`[]DIRECT

; 【AI专属出口】锁定贵机场！只展示贵机场的所有节点，方便你在面板中任意指定某个特定节点
custom_proxy_group=🤖 AI服务`select`!!GROUPID=1`[]🔄 故障转移`[]DIRECT

; 【主备故障转移核心】死守第1位（便宜主力），挂了自动切第2位（优质备用）；便宜主力恢复后自动切回
custom_proxy_group=🔄 故障转移`fallback`[]⚡ 便宜主力`[]🛡️ 优质备用`http://www.gstatic.com/generate_204`60,,3000

; 【便宜机场内部自动优选】自动挑选便宜机场中延迟最低的可用节点，避免单节点小波动就惊动贵机场
custom_proxy_group=⚡ 便宜主力`url-test`!!GROUPID=0`http://www.gstatic.com/generate_204`300,50,2000

; 【贵机场内部自动优选】贵机场中的延迟最低可用节点
custom_proxy_group=🛡️ 优质备用`url-test`!!GROUPID=1`http://www.gstatic.com/generate_204`300,50,2000

; 【国内直连】
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择

; 【未命中规则的兜底】
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]DIRECT

; ========================================================
; 2. 分流规则集配置 (Rulesets) - 按从上到下优先级匹配
; ========================================================

; 本地局域网流量直连
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list

; AI 服务专属规则（OpenAI / ChatGPT / Claude / Gemini / Copilot 等，强制走贵机场）
ruleset=🤖 AI服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list

; 常见国内域名直连（淘宝、微信、百度、B站等）
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list

; 中国大陆 IP 直连（白名单模式）
ruleset=🎯 全球直连,[]GEOIP,CN

; 其余所有未匹配到的国外流量，全部走漏网之鱼 -> 🚀 节点选择 -> 🔄 故障转移
ruleset=🐟 漏网之鱼,[]FINAL
