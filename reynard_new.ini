[custom]
; 引入 base.yaml 底包
clash_rule_base=https://raw.githubusercontent.com/reynardli/openclash/refs/heads/main/base.yaml
enable_rule_generator=true
overwrite_original_rules=true

; ========================================================
; 1. 策略组配置 (Proxy Groups)
; ========================================================

; 【自动选优与主备核心】
custom_proxy_group=⚡ 便宜主力`url-test`!!GROUPID=0`http://www.gstatic.com/generate_204`300,50,2000
custom_proxy_group=🛡️ 优质备用`url-test`!!GROUPID=1`http://www.gstatic.com/generate_204`300,50,2000
custom_proxy_group=🔄 故障转移`fallback`[]⚡ 便宜主力`[]🛡️ 优质备用`http://www.gstatic.com/generate_204`60,,3000

; 【总出口 Proxies】
custom_proxy_group=Proxies`select`[]🔄 故障转移`[]⚡ 便宜主力`[]🛡️ 优质备用`.*`[]DIRECT

; 【AI 专属出口】锁定贵机场，展示 ytoo 节点
custom_proxy_group=OpenAI`select`!!GROUPID=1`[]🛡️ 优质备用`[]Proxies`[]DIRECT

; 【GitHub 专属出口】
custom_proxy_group=GitHub`select`[]Proxies`[]🔄 故障转移`[]⚡ 便宜主力`[]🛡️ 优质备用`.*`[]DIRECT

; 【专属业务分组】
custom_proxy_group=YouTube`select`[]Proxies`[]🔄 故障转移`.*`[]DIRECT
custom_proxy_group=Google`select`[]Proxies`[]🔄 故障转移`.*`[]DIRECT
custom_proxy_group=Telegram`select`[]Proxies`[]🔄 故障转移`.*`[]DIRECT
custom_proxy_group=Netflix`select`[]Proxies`[]🔄 故障转移`.*`[]DIRECT
custom_proxy_group=Disney`select`[]Proxies`[]🔄 故障转移`.*`[]DIRECT
custom_proxy_group=Spotify`select`[]Proxies`[]DIRECT`[]🔄 故障转移`.*
custom_proxy_group=Steam`select`[]DIRECT`[]Proxies`[]🔄 故障转移`.*
custom_proxy_group=Microsoft`select`[]DIRECT`[]Proxies`[]🔄 故障转移`.*
custom_proxy_group=Apple`select`[]DIRECT`[]Proxies`[]🔄 故障转移`.*

; 【兜底与应急开关】默认保持 DIRECT（直连），遇到打不开的冷门外网手动切 Proxies
custom_proxy_group=Final`select`[]DIRECT`[]Proxies`[]🔄 故障转移

; ========================================================
; 2. 分流规则集配置 (自上而下严格按优先级执行)
; ========================================================

; 1. 局域网直连（最高优先级）
ruleset=DIRECT,https://fastly.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/LocalAreaNetwork.list

; 2. 【核心提权】Gemini 与海外 AI 专有域名（先于一切规则拦截，锁死 ytoo）
ruleset=OpenAI,[]DOMAIN-SUFFIX,xn--ngstr-lra8j.com
ruleset=OpenAI,[]DOMAIN-SUFFIX,googleapis.cn
ruleset=OpenAI,[]DOMAIN-SUFFIX,services.googleapis.cn
ruleset=OpenAI,[]DOMAIN-SUFFIX,gemini.google.com
ruleset=OpenAI,[]DOMAIN-SUFFIX,aistudio.google.com
ruleset=OpenAI,[]DOMAIN-SUFFIX,generativelanguage.googleapis.com
ruleset=OpenAI,[]DOMAIN-SUFFIX,deepmind.google
ruleset=OpenAI,[]DOMAIN-SUFFIX,deepmind.com
ruleset=OpenAI,[]DOMAIN,proactivebackend-pa.googleapis.com
ruleset=OpenAI,[]DOMAIN,notifications-pa.googleapis.com
ruleset=OpenAI,[]DOMAIN,alkalimakersuite-pa.clients6.google.com
ruleset=OpenAI,[]DOMAIN-KEYWORD,gemini
ruleset=OpenAI,[]DOMAIN-KEYWORD,aistudio
ruleset=OpenAI,[]DOMAIN-KEYWORD,bard
ruleset=OpenAI,https://fastly.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Gemini/Gemini.list
ruleset=OpenAI,https://fastly.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/OpenAi.list
ruleset=OpenAI,https://fastly.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Claude/Claude.list

; 3. GitHub 专属规则
ruleset=GitHub,https://fastly.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/GitHub/GitHub.list

; 4. 明确需要走代理或特定策略的知名海外平台
ruleset=YouTube,https://fastly.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/YouTube.list
ruleset=Netflix,https://fastly.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/Netflix.list
ruleset=Disney,https://fastly.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/DisneyPlus.list
ruleset=Spotify,https://fastly.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/Spotify.list
ruleset=Telegram,https://fastly.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/Telegram.list
ruleset=Google,https://fastly.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/Google.list
ruleset=Microsoft,https://fastly.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/Microsoft.list
ruleset=Steam,https://fastly.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/Steam.list
ruleset=Apple,https://fastly.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/Apple.list

; 5. 【关键改进：国内域名与大厂云存储提前直连】
; 放在 Global.list 之前！防止国产软件（如 WorkBuddy）的接口、腾讯云/阿里云下载源被海外规则集误伤截流
ruleset=DIRECT,[]DOMAIN-SUFFIX,cn
ruleset=DIRECT,[]DOMAIN-SUFFIX,com.cn
ruleset=DIRECT,[]DOMAIN-SUFFIX,net.cn
ruleset=DIRECT,[]DOMAIN-SUFFIX,gov.cn
ruleset=DIRECT,[]DOMAIN-SUFFIX,edu.cn
ruleset=DIRECT,[]DOMAIN-KEYWORD,alicdn
ruleset=DIRECT,[]DOMAIN-KEYWORD,aliyuncs
ruleset=DIRECT,[]DOMAIN-KEYWORD,myqcloud
ruleset=DIRECT,[]DOMAIN-KEYWORD,gtimg
ruleset=DIRECT,[]DOMAIN-KEYWORD,bdimg
ruleset=DIRECT,[]DOMAIN-KEYWORD,baidupcs
ruleset=DIRECT,[]DOMAIN-KEYWORD,volces
ruleset=DIRECT,https://fastly.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/ChinaMax/ChinaMax_Domain.list

; 6. 常规海外网站大包（排在国内域名之后，只抓真正的海外网站）
ruleset=Proxies,https://fastly.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Global/Global.list

; 7. 【关键改进：国内物理 IP 识别】
; 哪怕是刚上线 1 分钟、没有任何域名库收录的全新国产软件（如 WorkBuddy），只要服务器 IP 在中国境内，直接命中 GEOIP,CN 走直连，绝不掉入 Final！
ruleset=DIRECT,https://fastly.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/ChinaCompanyIp.list
ruleset=DIRECT,[]GEOIP,CN

; 8. 【兜底】极少数既不在上述名单、IP 也不在国内的未知流量，进入 Final（默认 DIRECT，需要时手切 Proxies）
ruleset=Final,[]FINAL
