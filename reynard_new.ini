[custom]
; 引入 base.yaml 底包
clash_rule_base=https://raw.githubusercontent.com/reynardli/openclash/refs/heads/main/base.yaml
enable_rule_generator=true
overwrite_original_rules=true

; ========================================================
; 1. 策略组配置 (Proxy Groups)
; ========================================================

; 【自动选优与主备核心】
custom_proxy_group=⚡ 便宜主力`url-test`!!GROUPID=0`http://www.gstatic.com/generate_204`300,50,2000
custom_proxy_group=🛡️ 优质备用`url-test`!!GROUPID=1`http://www.gstatic.com/generate_204`300,50,2000
custom_proxy_group=🔄 故障转移`fallback`[]⚡ 便宜主力`[]🛡️ 优质备用`http://www.gstatic.com/generate_204`60,,3000

; 【总出口 Proxies】
custom_proxy_group=Proxies`select`[]🔄 故障转移`[]⚡ 便宜主力`[]🛡️ 优质备用`.*`[]DIRECT

; 【AI 专属出口】锁定贵机场，展示 ytoo 节点
custom_proxy_group=OpenAI`select`!!GROUPID=1`[]🛡️ 优质备用`[]Proxies`[]DIRECT

; 【GitHub 专属出口】
custom_proxy_group=GitHub`select`[]Proxies`[]🔄 故障转移`[]⚡ 便宜主力`[]🛡️ 优质备用`.*`[]DIRECT

; 【专属业务分组】
custom_proxy_group=YouTube`select`[]Proxies`[]🔄 故障转移`[]⚡ 便宜主力`[]🛡️ 优质备用`.*`[]DIRECT
custom_proxy_group=Google`select`[]Proxies`[]🔄 故障转移`[]⚡ 便宜主力`[]🛡️ 优质备用`.*`[]DIRECT
custom_proxy_group=Telegram`select`[]Proxies`[]🔄 故障转移`.*`[]DIRECT
custom_proxy_group=Netflix`select`[]Proxies`[]🔄 故障转移`.*`[]DIRECT
custom_proxy_group=Disney`select`[]Proxies`[]🔄 故障转移`.*`[]DIRECT
custom_proxy_group=Spotify`select`[]Proxies`[]DIRECT`[]🔄 故障转移`.*
custom_proxy_group=Steam`select`[]DIRECT`[]Proxies`[]🔄 故障转移`.*
custom_proxy_group=Microsoft`select`[]DIRECT`[]Proxies`[]🔄 故障转移`.*
custom_proxy_group=Apple`select`[]DIRECT`[]Proxies`[]🔄 故障转移`.*

; 【兜底与应急开关】默认保持 DIRECT（直连），遇到打不开的冷门外网手动切 Proxies
custom_proxy_group=Final`select`[]DIRECT`[]Proxies`[]🔄 故障转移

; ========================================================
; 2. 分流规则集配置 (核心大站采用“内联硬编码 + 规则库”双保险)
; ========================================================

; 1. 局域网直连
ruleset=DIRECT,[]IP-CIDR,192.168.0.0/16,no-resolve
ruleset=DIRECT,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=DIRECT,[]IP-CIDR,172.16.0.0/12,no-resolve
ruleset=DIRECT,[]IP-CIDR,127.0.0.0/8,no-resolve

; 2. 【AI 强行锁死】内联硬编码 + 列表，绝不依赖外部网络状况
ruleset=OpenAI,[]DOMAIN-SUFFIX,gemini.google.com
ruleset=OpenAI,[]DOMAIN-SUFFIX,aistudio.google.com
ruleset=OpenAI,[]DOMAIN-SUFFIX,generativelanguage.googleapis.com
ruleset=OpenAI,[]DOMAIN-SUFFIX,deepmind.google
ruleset=OpenAI,[]DOMAIN-SUFFIX,deepmind.com
ruleset=OpenAI,[]DOMAIN-SUFFIX,openai.com
ruleset=OpenAI,[]DOMAIN-SUFFIX,chatgpt.com
ruleset=OpenAI,[]DOMAIN-SUFFIX,oaistatic.com
ruleset=OpenAI,[]DOMAIN-SUFFIX,oaiusercontent.com
ruleset=OpenAI,[]DOMAIN-SUFFIX,anthropic.com
ruleset=OpenAI,[]DOMAIN-SUFFIX,claude.ai
ruleset=OpenAI,[]DOMAIN,proactivebackend-pa.googleapis.com
ruleset=OpenAI,[]DOMAIN,notifications-pa.googleapis.com
ruleset=OpenAI,[]DOMAIN,alkalimakersuite-pa.clients6.google.com
ruleset=OpenAI,[]DOMAIN-KEYWORD,gemini
ruleset=OpenAI,[]DOMAIN-KEYWORD,aistudio
ruleset=OpenAI,[]DOMAIN-KEYWORD,openai
ruleset=OpenAI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list
ruleset=OpenAI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=OpenAI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list

; 3. 【GitHub 双保险】内联硬编码 + 列表
ruleset=GitHub,[]DOMAIN-SUFFIX,github.com
ruleset=GitHub,[]DOMAIN-SUFFIX,githubusercontent.com
ruleset=GitHub,[]DOMAIN-SUFFIX,githubassets.com
ruleset=GitHub,[]DOMAIN-SUFFIX,github.io
ruleset=GitHub,[]DOMAIN-KEYWORD,github
ruleset=GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list

; 4. 【YouTube 双保险】内联硬编码置于 Google 之前，确保视频流精准命中
ruleset=YouTube,[]DOMAIN-SUFFIX,youtube.com
ruleset=YouTube,[]DOMAIN-SUFFIX,youtu.be
ruleset=YouTube,[]DOMAIN-SUFFIX,googlevideo.com
ruleset=YouTube,[]DOMAIN-SUFFIX,ytimg.com
