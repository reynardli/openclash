port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
allow-lan: true
mode: rule
log-level: info
unified-delay: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  listen: 0.0.0.0:7874
  use-hosts: true
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    # 1. 贵机场 (ytoo) 与便宜机场 (良心云) 节点域名
    - "+.163cdn-agent.net"
    - "+.lxyun.xyz"
    - "+.7770006.xyz"
    - "+.777078.xyz"
    - "+.7770008.xyz"
    # 2. 腾讯/LOL/百度等核心直连域名强制拿真实物理 IP（彻底防断网、防 999ms）
    - "+.baidu.com"
    - "+.qq.com"
    - "+.tencent.com"
    - "+.myqcloud.com"
    - "+.gtimg.cn"
    - "+.game.qq.com"
    - "+.lol.qq.com"
    - "+.pvp.net"
    - "+.riotgames.com"
    - "+.leagueoflegends.com"
    - "+.rumt-zh.com"
    # 3. 局域网与系统探测放行
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 关键修正：去掉 127.0.0.1:7874 防止 DNS 自举死锁！
  # 因为上面开启了 use-hosts: true，ytoo 依然能正常命中下方的 hosts 映射
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

hosts:
  6c106cf4-cb0f-11f01.163cdn-agent.net: 4406d026-59f4-11f1.163cdn-agent.net
  6c106cf4-cb0f-11f02.163cdn-agent.net: 4406d026-59f4-11f2.163cdn-agent.net
  6c106cf4-cb0f-11f03.163cdn-agent.net: 4406d026-59f4-11f3.163cdn-agent.net
  c70ac48e-2018.163cdn-agent.net: b8e0f308-59fa-11f.163cdn-agent.net
